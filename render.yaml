# Render blueprint for the API (single instance, MVP). Set MONGODB_URI and CORS_ORIGINS in the dashboard.
services:
  - type: web
    name: flamlink-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
